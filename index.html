<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Gimme Gold</title>
    <meta name="description" content="Entiende tu ciclo hormonal, con Billy." />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=2" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Gimme Gold" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2" />
    <script>
      // On a partner link, install his page, not her app, with his own name and icon: a manifest whose start_url is his link
      // (served by the rewrite in vercel.json). Set before anything reads the manifest.
      ;(function () {
        var m = location.pathname.match(/^\/pareja\/([^/]+)/)
        if (!m) return
        document.querySelector('link[rel="manifest"]').href = '/pareja/' + m[1] + '/manifest.webmanifest'
        document.querySelector('meta[name="apple-mobile-web-app-title"]').content = 'Billy'
        // His icon is Billy playing dead; hers is Billy with a heart.
        document.querySelector('link[rel="apple-touch-icon"]').href = '/icons/pareja-apple-touch-icon.png'
      })()
    </script>
    <meta name="theme-color" content="#FFFFFF" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
