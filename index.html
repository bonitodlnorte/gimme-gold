<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Gimme Gold</title>
    <meta name="description" content="Entiende tu ciclo hormonal, con Billy." />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // The install tags are written here, not changed afterwards: Safari can keep the manifest it saw first, so a partner link
      // that started with hers opened her login. On a partner link, his page installs with his own name and icon, and a
      // manifest whose start_url is his link (served by the rewrite in vercel.json). On /instalar/<token>/ her app installs
      // with that hand-off token in its start_url, so it opens signed in (see Traspaso.tsx).
      ;(function () {
        var m = location.pathname.match(/^\/pareja\/([^/]+)/)
        var h = location.pathname.match(/^\/instalar\/([^/]+)/)
        var manifest = m ? '/pareja/' + m[1] + '/manifest.webmanifest' : h ? '/instalar/' + h[1] + '/manifest.webmanifest' : '/manifest.json'
        var title = m ? 'Billy' : 'Gimme Gold'
        // His icon is Billy playing dead; hers is Billy with a heart.
        var icon = m ? '/icons/pareja-apple-touch-icon.png' : '/icons/apple-touch-icon.png?v=2'
        document.write(
          '<link rel="manifest" href="' + manifest + '" />' +
            '<meta name="apple-mobile-web-app-title" content="' + title + '" />' +
            '<link rel="apple-touch-icon" href="' + icon + '" />',
        )
      })()
    </script>
    <meta name="theme-color" content="#FFFFFF" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
